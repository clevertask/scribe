name: Update pnpm Dependencies

on:
  schedule:
    - cron: "27 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-dependency-update
  cancel-in-progress: false

jobs:
  update:
    uses: clevertask/clevertask-public-workflows/.github/workflows/update-pnpm-dependencies.yml@0c7e4a3a72b2447706d205c2f5b8ba784999f2e7
    with:
      package_roots: '["."]'
      review_team: dependency-reviewers
    secrets:
      review_token: ${{ secrets.CLEVERTASK_DEPENDENCY_REVIEW_TOKEN }}
