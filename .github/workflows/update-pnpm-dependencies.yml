name: Update pnpm Dependencies

on:
  schedule:
    - cron: "27 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-dependency-update
  cancel-in-progress: false

jobs:
  update:
    uses: clevertask/clevertask-public-workflows/.github/workflows/update-pnpm-dependencies.yml@41e4d9c243bb7a638eb449f0099a2c92cadceb96
    with:
      package_roots: '["."]'
      review_team: dependency-reviewers
    secrets:
      review_token: ${{ secrets.CLEVERTASK_PAT }}
