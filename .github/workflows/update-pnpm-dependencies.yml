name: Update pnpm Dependencies

on:
  schedule:
    - cron: "27 10 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-dependency-update
  cancel-in-progress: false

jobs:
  update:
    uses: clevertask/clevertask-public-workflows/.github/workflows/update-pnpm-dependencies.yml@df42d860aab0c55b520df7e4894915a5e80d09d3
    with:
      package_roots: '["."]'
      review_team: dependency-reviewers
    secrets:
      review_token: ${{ secrets.CLEVERTASK_DEPENDENCY_REVIEW_TOKEN }}
